name: build-dist

# 分支职责：
#   upstream  = 纯上游镜像（wess09/AzurPilot master），每次运行自动 force push 对齐
#   main      = 二次修改开发分支，上游合并由 sync-upstream 技能手动完成
#   dist-main = 发布分支：每次构建在其上**追加**一个全量树快照提交
#               （main 源码 + 预构建 dist，用 git read-tree/commit-tree 组树，
#               父提交是上一次的 dist-main tip）。只追加、从不重写，
#               保证安装副本的 HEAD 永远是更新源历史的祖先：
#               更新恒为 fast-forward，ahead 恒为 0，不存在 SHA 不匹配。
#
# 客户端 deploy.yaml：
#   Repository: https://github.com/xb18/AzurNext
#   Branch: dist-main
#
# 幂等：dist-main 顶端提交内嵌的 main 短 SHA 与当前 main 一致时跳过构建。

on:
  push:
    branches: [main]
  schedule:
    # 每 2 小时兜底重跑，与 push 触发互为备份；已对齐时直接退出。
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 同步 upstream 镜像分支
        run: |
          git fetch --depth 1 https://github.com/wess09/AzurPilot.git master
          git push --force origin FETCH_HEAD:refs/heads/upstream

      - name: 检查 dist-main 是否已对齐
        id: aligned
        run: |
          main_short=$(git rev-parse --short=12 HEAD)
          if git fetch --depth 1 origin dist-main 2>/dev/null; then
            tip_main=$(git log -1 --format=%s FETCH_HEAD | sed -n 's/.*main@\([0-9a-f]\{12,\}\).*/\1/p')
            echo "tip_main=$tip_main"
            echo "main_short=$main_short"
            if [ -n "$tip_main" ] && [ "$tip_main" = "$main_short" ]; then
              echo "aligned=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "aligned=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.aligned.outputs.aligned == 'false'
        with:
          node-version: 22

      - name: 构建前端并写入指纹
        if: steps.aligned.outputs.aligned == 'false'
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend
          python3 -c "from pathlib import Path; from deploy.frontend import source_fingerprint; p = Path('frontend'); (p / 'dist/.source-fingerprint').write_text(source_fingerprint(p) + '\n', encoding='utf-8')"

      - name: 发布 dist-main（追加式全量快照）
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          parent=""
          if git fetch --depth 1 origin dist-main 2>/dev/null; then
            parent=$(git rev-parse FETCH_HEAD)
          fi

          # 期望树 = main 的完整源码树 - 开发专属目录 + 构建产物 dist。
          # launcher/（启动器源码，约 50MB）只服务于开发和打包 CI，
          # 安装副本用不到，从发布快照中剔除，避免客户端更新白拉。
          export GIT_INDEX_FILE="$PWD/.git/dist-index"
          git read-tree HEAD
          git rm -r --cached -q launcher 2>/dev/null || true
          git add -f frontend/dist
          tree=$(git write-tree)
          rm -f "$GIT_INDEX_FILE"

          # 树内容与 dist-main 顶端完全一致时（例如仅后端无关改动重跑）跳过发布。
          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then
            echo "dist-main 顶端与期望树一致，跳过发布"
            exit 0
          fi

          if [ -n "$parent" ]; then
            commit=$(git commit-tree "$tree" -p "$parent" -m "build(dist): 预构建前端产物 main@$(git rev-parse --short=12 HEAD)")
          else
            commit=$(git commit-tree "$tree" -m "build(dist): 预构建前端产物 main@$(git rev-parse --short=12 HEAD)")
          fi
          # 追加模式：父提交就是 dist-main 当前 tip，推送恒为 fast-forward。
          git push origin "$commit:refs/heads/dist-main"

          # 安卓宿主分发渠道：frontend-<main提交>.tar.xz + .sha256，
          # 宿主按 BUILD_MANIFEST 里的 azurpilot_commit 拉取，tar 根目录为 dist/。
          android_sha=$(git rev-parse HEAD)
          tar -cJf "frontend-${android_sha}.tar.xz" -C frontend dist
          sha256sum "frontend-${android_sha}.tar.xz" > "frontend-${android_sha}.tar.xz.sha256"

      - name: 发布安卓前端分发产物
        if: steps.aligned.outputs.aligned == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-dist --repo xb18/AzurNext >/dev/null 2>&1 || \
            gh release create android-dist --repo xb18/AzurNext \
              --title "Android dist channel" --notes "滚动更新：最新 main 提交的预构建前端 dist"
          gh release upload android-dist --repo xb18/AzurNext --clobber \
            frontend-*.tar.xz frontend-*.tar.xz.sha256
